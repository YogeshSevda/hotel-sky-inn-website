  <rect x="1" y="1" width="398" height="298" fill="none" stroke="#c9a15a" stroke-width="1.5" opacity="0.5"/>
  <rect x="8" y="8" width="384" height="284" fill="none" stroke="#c9a15a" stroke-width="1" opacity="0.35"/>
  <g transform="translate(140,68)" fill="none" stroke="#8a4a2b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
