      <stop offset="0" stop-color="#f3e8d6"/>
      <stop offset="1" stop-color="#e8d5b0"/>
    </linearGradient>
    <pattern id="arch-rooftop" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 V20 a20 20 0 0 1 40 0 V40" fill="none" stroke="#c9a15a" stroke-width="1" opacity="0.16"/>
